<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUFFY - Ticker Overlay</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        
        body.overlay-mode { background: transparent !important; padding: 0; margin: 0; overflow: hidden; }
        body { background-color: #0b0b0d; color: #fff; padding: 20px; display: flex; justify-content: center; }

        .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #141418; border: 1px solid #282832; border-radius: 12px; padding: 15px; }
        .title { color: #facc15; font-size: 16px; font-weight: bold; margin-bottom: 10px; }

        /* شريط الحركة */
        .marquee-box { background: rgba(0,0,0,0.85); border: 1px solid #333; border-radius: 8px; height: 60px; overflow: hidden; position: relative; display: flex; align-items: center; width: 100%; }
        body.overlay-mode .marquee-box { background: transparent; border: none; height: 100vh; }
        
        .marquee-track { display: flex; white-space: nowrap; position: absolute; will-change: transform; animation: marquee var(--speed, 35s) linear infinite; }
        .marquee-item { font-size: 22px; font-weight: bold; color: #fff; display: flex; align-items: center; }
        .marquee-item .amount { color: #facc15; margin-right: 8px; }
        .marquee-item .sep { margin: 0 20px; color: #facc15; }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(50%); } }

        /* عناصر التحكم */
        .url-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .speed-control { display: flex; align-items: center; gap: 15px; background: #0d0d10; padding: 12px 15px; border-radius: 8px; border: 1px solid #222; margin-top: 10px; }
        .speed-control input[type="range"] { accent-color: #facc15; cursor: pointer; flex: 1; }

        .slots-grid { display: flex; flex-direction: column; gap: 8px; }
        .slot-row { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; background: #0d0d10; padding: 6px 10px; border-radius: 6px; border: 1px solid #222; }
        input[type="text"], input[type="number"] { background: #16161c; border: 1px solid #2a2a36; border-radius: 6px; padding: 8px; color: #fff; outline: none; width: 100%; }
        input:focus { border-color: #facc15; }

        .btn-yellow { background: #facc15; color: #000; border: none; border-radius: 6px; padding: 10px 20px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-yellow:hover { background: #eab308; }
    </style>
</head>
<body>

<div class="container" id="dashContainer">
    <div class="card">
        <h2 style="color:#facc15; margin-bottom:10px;">LUFFY - رابط البث العام</h2>
        <div class="url-box">
            <input type="text" id="finalUrl" readonly value="توليد الرابط...">
            <button class="btn-yellow" onclick="copyUrl()">📋 نسخ الرابط العام</button>
        </div>
        <p style="color:#888; font-size:12px;">تنبيه: انسخ هذا الرابط وضعه في برنامج البث ليقرأ السرعة والأسماء مباشرة عبر النت.</p>
    </div>

    <div class="card">
        <div class="title">👁️ المعاينة الحية والسرعة</div>
        <div class="marquee-box">
            <div class="marquee-track" id="track"></div>
        </div>

        <div class="speed-control">
            <label style="color:#facc15; font-weight:bold;">⚡ السرعة:</label>
            <input type="range" id="speedRange" min="1" max="10" value="2" oninput="updateAll()">
            <span id="speedValue" style="color:#fff; font-weight:bold; min-width:90px;">بطيء جداً</span>
        </div>
    </div>

    <div class="card">
        <div class="title">📝 10 خانات (اسم + المبلغ IQD)</div>
        <div class="slots-grid" id="slots"></div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const isOverlay = urlParams.get('mode') === 'overlay';

    if (isOverlay) {
        document.body.classList.add('overlay-mode');
        document.getElementById('dashContainer').style.display = 'none';
        const box = document.createElement('div');
        box.className = 'marquee-box';
        box.innerHTML = '<div class="marquee-track" id="trackOverlay"></div>';
        document.body.appendChild(box);
        
        // قراءة السرعة والأسماء والبيانات المباشرة من الرابط الشامل
        const speed = urlParams.get('sp') || 2;
        const names = JSON.parse(decodeURIComponent(urlParams.get('n') || "[]"));
        const amounts = JSON.parse(decodeURIComponent(urlParams.get('a') || "[]"));

        applySpeed(speed);
        render(names, amounts, 'trackOverlay');
    } else {
        init();
    }

    function init() {
        const slots = document.getElementById('slots');
        const defaultNames = ["علي الكرخي", "حسين العراقي", "محمد البصراوي"];
        const defaultAmounts = ["50000", "25000", "10000"];

        for (let i = 0; i < 10; i++) {
            slots.innerHTML += `
                <div class="slot-row">
                    <div style="color:#888; text-align:center; line-height:35px;">#${i+1}</div>
                    <input type="text" placeholder="الاسم" class="s-name" value="${defaultNames[i] || ''}" oninput="updateAll()">
                    <input type="number" placeholder="المبلغ د.ع" class="s-amount" value="${defaultAmounts[i] || ''}" oninput="updateAll()">
                </div>
            `;
        }
        updateAll();
    }

    function applySpeed(val) {
        const seconds = 65 - (val * 5.5);
        document.documentElement.style.setProperty('--speed', `${seconds}s`);

        const txt = document.getElementById('speedValue');
        if (txt) {
            if (val <= 2) txt.innerText = "بطيء جداً";
            else if (val <= 5) txt.innerText = "متوسط";
            else txt.innerText = "سريع";
        }
    }

    function updateAll() {
        const val = document.getElementById('speedRange').value;
        applySpeed(val);

        const names = Array.from(document.querySelectorAll('.s-name')).map(i => i.value.trim());
        const amounts = Array.from(document.querySelectorAll('.s-amount')).map(i => i.value.trim());

        render(names, amounts, 'track');

        // بناء الرابط الشامل مع التشفير الآمن للمشرق العربي
        const p = new URLSearchParams();
        p.set('mode', 'overlay');
        p.set('sp', val);
        p.set('n', encodeURIComponent(JSON.stringify(names)));
        p.set('a', encodeURIComponent(JSON.stringify(amounts)));

        const baseUrl = window.location.href.split('?')[0];
        const fullUrl = baseUrl + '?' + p.toString();
        document.getElementById('finalUrl').value = fullUrl;
    }

    function render(names, amounts, id) {
        let items = [];
        for (let i = 0; i < 10; i++) {
            if (names[i]) {
                const amt = amounts[i] ? `${Number(amounts[i]).toLocaleString('ar-IQ')} د.ع` : '';
                items.push(`<div class="marquee-item"><span>${names[i]}</span>${amt ? `<span class="amount">(${amt})</span>` : ''}<span class="sep">•</span></div>`);
            }
        }
        const el = document.getElementById(id);
        if (el) {
            const content = items.length ? items.join('') : '<div class="marquee-item">LUFFY Ticker <span class="sep">•</span></div>';
            el.innerHTML = content + content + content + content;
        }
    }

    function copyUrl() {
        const urlInput = document.getElementById('finalUrl');
        urlInput.select();
        navigator.clipboard.writeText(urlInput.value);
        alert('تم نسخ الرابط العام الشامل بنجاح!');
    }
</script>
</body>
</html>
