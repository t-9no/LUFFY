<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUFFY - Ticker</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        
        /* جعل الخلفية شفافة تلقائياً عند إخفاء التحكم */
        body { background-color: #0b0b0d; color: #fff; padding: 15px; display: flex; justify-content: center; }
        body.transparent { background: transparent !important; padding: 0; margin: 0; overflow: hidden; }

        .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #141418; border: 1px solid #282832; border-radius: 12px; padding: 15px; }
        .title { color: #facc15; font-size: 16px; font-weight: bold; margin-bottom: 10px; }

        /* شريط الحركة */
        .marquee-box { background: rgba(0,0,0,0.85); border: 1px solid #333; border-radius: 8px; height: 60px; overflow: hidden; position: relative; display: flex; align-items: center; width: 100%; }
        body.transparent .marquee-box { background: transparent; border: none; height: 100vh; }
        
        .marquee-track { display: flex; white-space: nowrap; position: absolute; will-change: transform; animation: marquee var(--speed, 35s) linear infinite; }
        .marquee-item { font-size: 24px; font-weight: bold; color: #fff; display: flex; align-items: center; }
        .marquee-item .amount { color: #facc15; margin-right: 8px; }
        .marquee-item .sep { margin: 0 25px; color: #facc15; }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(50%); } }

        .speed-control { display: flex; align-items: center; gap: 15px; background: #0d0d10; padding: 12px 15px; border-radius: 8px; border: 1px solid #222; margin-top: 10px; }
        .speed-control input[type="range"] { accent-color: #facc15; cursor: pointer; flex: 1; }

        .slots-grid { display: flex; flex-direction: column; gap: 8px; }
        .slot-row { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; background: #0d0d10; padding: 6px 10px; border-radius: 6px; border: 1px solid #222; }
        input[type="text"], input[type="number"] { background: #16161c; border: 1px solid #2a2a36; border-radius: 6px; padding: 8px; color: #fff; outline: none; width: 100%; }
        input:focus { border-color: #facc15; }

        .btn-toggle { background: #facc15; color: #000; border: none; border-radius: 6px; padding: 8px 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="controlPanel">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:#facc15;">LUFFY - شريط البث المباشر</h2>
        <button class="btn-toggle" onclick="enableStreamMode()">👁️ معاينة الشفافية للبث</button>
    </div>

    <div class="card">
        <div class="title">👁️ المعاينة الحية</div>
        <div class="marquee-box">
            <div class="marquee-track" id="track"></div>
        </div>

        <div class="speed-control">
            <label style="color:#facc15; font-weight:bold;">⚡ التحكم بالسرعة:</label>
            <input type="range" id="speedRange" min="1" max="10" value="2" oninput="updateAll()">
            <span id="speedValue" style="color:#fff; font-weight:bold; min-width:90px;">بطيء جداً</span>
        </div>
    </div>

    <div class="card">
        <div class="title">📝 10 خانات (الاسم + المبلغ IQD)</div>
        <div class="slots-grid" id="slots"></div>
    </div>
</div>

<script>
    // التأكد إذا تم فتح الملف في وضع البث عبر إضافة ?live في نهاية مسار الملف
    const isLiveMode = window.location.search.includes('live');

    if (isLiveMode) {
        enableStreamMode();
    } else {
        init();
    }

    function init() {
        const slots = document.getElementById('slots');
        const savedSlots = JSON.parse(localStorage.getItem('luffy_slots')) || [
            { name: "علي الكرخي", amount: "50000" },
            { name: "حسين العراقي", amount: "25000" },
            { name: "محمد البصراوي", amount: "10000" }
        ];
        const savedSpeed = localStorage.getItem('luffy_speed') || 2;

        document.getElementById('speedRange').value = savedSpeed;
        
        for (let i = 0; i < 10; i++) {
            const name = savedSlots[i] ? savedSlots[i].name : '';
            const amount = savedSlots[i] ? savedSlots[i].amount : '';
            slots.innerHTML += `
                <div class="slot-row">
                    <div style="color:#888; text-align:center; line-height:35px;">#${i+1}</div>
                    <input type="text" placeholder="الاسم" class="s-name" value="${name}" oninput="updateAll()">
                    <input type="number" placeholder="المبلغ د.ع" class="s-amount" value="${amount}" oninput="updateAll()">
                </div>
            `;
        }
        updateAll();
    }

    function updateAll() {
        const val = document.getElementById('speedRange').value;
        const seconds = 65 - (val * 5.5);
        document.documentElement.style.setProperty('--speed', `${seconds}s`);

        const txt = document.getElementById('speedValue');
        if (txt) {
            if (val <= 2) txt.innerText = "بطيء جداً";
            else if (val <= 5) txt.innerText = "متوسط";
            else txt.innerText = "سريع";
        }

        const names = Array.from(document.querySelectorAll('.s-name')).map(i => i.value.trim());
        const amounts = Array.from(document.querySelectorAll('.s-amount')).map(i => i.value.trim());

        render(names, amounts);

        // حفظ التغييرات في ملفات النظام المحلية
        let slotsData = [];
        for(let i=0; i<10; i++) slotsData.push({ name: names[i], amount: amounts[i] });
        localStorage.setItem('luffy_slots', JSON.stringify(slotsData));
        localStorage.setItem('luffy_speed', val);
    }

    function render(names, amounts) {
        let items = [];
        for (let i = 0; i < 10; i++) {
            if (names[i]) {
                const amt = amounts[i] ? `${Number(amounts[i]).toLocaleString('ar-IQ')} د.ع` : '';
                items.push(`<div class="marquee-item"><span>${names[i]}</span>${amt ? `<span class="amount">(${amt})</span>` : ''}<span class="sep">•</span></div>`);
            }
        }
        const el = document.getElementById('track');
        if (el) {
            const content = items.length ? items.join('') : '<div class="marquee-item">LUFFY Ticker <span class="sep">•</span></div>';
            el.innerHTML = content + content + content + content;
        }
    }

    function enableStreamMode() {
        document.body.classList.add('transparent');
        document.getElementById('controlPanel').style.display = 'none';

        // إنشاء شريط خاص بالبث الشفاف
        const box = document.createElement('div');
        box.className = 'marquee-box';
        box.innerHTML = '<div class="marquee-track" id="track"></div>';
        document.body.appendChild(box);

        const savedSlots = JSON.parse(localStorage.getItem('luffy_slots')) || [];
        const savedSpeed = localStorage.getItem('luffy_speed') || 2;
        
        const seconds = 65 - (savedSpeed * 5.5);
        document.documentElement.style.setProperty('--speed', `${seconds}s`);

        render(savedSlots.map(s => s.name), savedSlots.map(s => s.amount));
    }
</script>
</body>
</html>
