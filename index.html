<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUFFY - Ticker Overlay Simple Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background-color: #0b0b0d; color: #fff; font-family: var(--font-family, 'Segoe UI', Tahoma, sans-serif); padding: 20px; display: flex; justify-content: center; }
        
        body.overlay-mode { 
            background-color: transparent !important; 
            padding: 0 !important; 
            margin: 0 !important; 
            overflow: hidden !important; 
        }

        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #141418; border: 1px solid #282832; border-radius: 12px; padding: 15px; }
        .title { color: #facc15; font-size: 16px; font-weight: bold; margin-bottom: 10px; }

        .marquee-box { 
            background: var(--bg-box-color, #000000); 
            border: 2px solid var(--border-color, #333333); 
            border-radius: 8px; 
            height: 60px; 
            overflow: hidden; 
            position: relative; 
            display: flex; 
            align-items: center; 
            width: 100%; 
            transition: all 0.3s;
        }
        
        body.overlay-mode .marquee-box { 
            border-radius: 0; 
            height: 100vh; 
            width: 100vw;
            border: none;
        }
        
        .marquee-track { display: flex; white-space: nowrap; position: absolute; will-change: transform; animation: marquee var(--speed, 30s) linear infinite; }
        
        .marquee-item { font-size: 24px; font-weight: bold; display: flex; align-items: center; font-family: var(--font-family, 'Segoe UI', Tahoma, sans-serif); }
        .marquee-item .name { color: var(--name-color, #ffffff); }
        .marquee-item .amount { color: var(--num-color, #facc15); margin-right: 8px; direction: ltr; display: inline-block; }
        .marquee-item .sep { margin: 0 20px; color: var(--border-color, #facc15); }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(50%); } }

        .url-box { display: flex; gap: 10px; margin-bottom: 10px; }
        .actions-box { display: flex; gap: 10px; margin-top: 15px; }
        
        .control-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: #0d0d10; padding: 12px 15px; border-radius: 8px; border: 1px solid #222; margin-top: 10px; }
        .control-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: #ccc; }
        input[type="color"] { border: none; width: 32px; height: 32px; border-radius: 5px; cursor: pointer; background: transparent; }

        .speed-control { display: flex; align-items: center; gap: 15px; grid-column: 1 / -1; }
        .speed-control input[type="range"] { accent-color: #facc15; cursor: pointer; flex: 1; }

        .slots-grid { display: flex; flex-direction: column; gap: 8px; }
        .slot-row { display: grid; grid-template-columns: 35px 1fr 1fr 90px; gap: 8px; background: #0d0d10; padding: 6px 10px; border-radius: 6px; border: 1px solid #222; }
        input[type="text"], input[type="number"], select { background: #16161c; border: 1px solid #2a2a36; border-radius: 6px; padding: 8px; color: #fff; outline: none; width: 100%; font-size: 14px; }
        input:focus, select:focus { border-color: #facc15; }

        .btn-yellow { background: #facc15; color: #000; border: none; border-radius: 6px; padding: 10px 20px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-yellow:hover { background: #eab308; }
        .btn-green { background: #22c55e; color: #000; border: none; border-radius: 6px; padding: 12px 20px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; font-size: 15px; }
        .btn-green:hover { background: #16a34a; }
    </style>
</head>
<body>

<div class="container" id="dashContainer">
    <div class="card">
        <h2 style="color:#facc15; margin-bottom:10px;">LUFFY - رابط الشريط المباشر لـ OBS</h2>
        <div class="url-box">
            <input type="text" id="finalUrl" readonly value="جاري إنشاء الرابط...">
            <button class="btn-yellow" onclick="copyUrl()">📋 نسخ رابط OBS</button>
        </div>
        <p style="color:#aaa; font-size:12px;">عدّل الخانات بالأسفل، واضغط "حفظ وتحديث" لنسخ الرابط المحدث تلقائياً.</p>
    </div>

    <div class="card">
        <div class="title">👁️ المعاينة الحية والتنسيق</div>
        <div class="marquee-box" id="previewBox">
            <div class="marquee-track" id="track"></div>
        </div>

        <div class="control-panel">
            <div class="control-item">
                <label>🎨 لون الأسماء:</label>
                <input type="color" id="cName" value="#ffffff" oninput="updateAll()">
            </div>
            <div class="control-item">
                <label>💰 لون الرقم:</label>
                <input type="color" id="cNum" value="#facc15" oninput="updateAll()">
            </div>
            <div class="control-item">
                <label>🖼 لون الإطار:</label>
                <input type="color" id="cBorder" value="#333333" oninput="updateAll()">
            </div>
            <div class="control-item">
                <label>⬛ لون الخلفية:</label>
                <input type="color" id="cBgBox" value="#000000" oninput="updateAll()">
            </div>
            
            <div class="control-item" style="grid-column: 1 / -1;">
                <label>✏ شكل الخط:</label>
                <select id="fontStyle" onchange="updateAll()">
                    <option value="'Segoe UI', Tahoma, sans-serif">حديث / افتراضي</option>
                    <option value="'Arial Black', Impact, sans-serif">عريض بارز (Bold)</option>
                    <option value="'Courier New', monospace">رقمي / تقني (Monospace)</option>
                    <option value="'Georgia', serif">كلاسيكي (Serif)</option>
                </select>
            </div>

            <div class="speed-control">
                <label style="color:#facc15; font-weight:bold;">⚡ السرعة:</label>
                <input type="range" id="speedRange" min="1" max="10" value="2" oninput="updateAll()">
                <span id="speedValue" style="color:#fff; font-weight:bold; min-width:90px;">بطيء جداً</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="title">📝 10 خانات (اسم + مبلغ + عملة)</div>
        <div class="slots-grid" id="slots"></div>
        
        <div class="actions-box">
            <button class="btn-green" onclick="saveData()">⚡ 💾 حفظ وتحديث رابط OBS</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const isOverlay = urlParams.get('mode') === 'overlay';

    if (isOverlay) {
        document.body.classList.add('overlay-mode');
        document.getElementById('dashContainer').style.display = 'none';
        
        const box = document.createElement('div');
        box.className = 'marquee-box';
        box.id = 'previewBoxOverlay';
        box.innerHTML = '<div class="marquee-track" id="trackOverlay"></div>';
        document.body.appendChild(box);
        
        // قراءة البيانات المضمنة في الرابط مباشر
        readUrlData();
        window.addEventListener('hashchange', readUrlData);
        window.addEventListener('storage', readLocalStorageData);
        readLocalStorageData();
    } else {
        init();
    }

    function readUrlData() {
        const hash = window.location.hash.substring(1);
        if (hash) {
            try {
                const decoded = JSON.parse(decodeURIComponent(hash));
                applyStyles(decoded.cn, decoded.cm, decoded.cb, decoded.cbg, decoded.ft);
                applySpeed(decoded.sp);
                render(decoded.names, decoded.amounts, decoded.currencies, 'trackOverlay');
            } catch(e){}
        }
    }

    function readLocalStorageData() {
        const hash = window.location.hash.substring(1);
        if (hash) return; // Prioritize hash

        const speed = localStorage.getItem('luffy_sp_v1') || 2;
        const cName = localStorage.getItem('luffy_cn_v1') || '#ffffff';
        const cNum = localStorage.getItem('luffy_cm_v1') || '#facc15';
        const cBorder = localStorage.getItem('luffy_cb_v1') || '#333333';
        const cBgBox = localStorage.getItem('luffy_cbg_v1') || '#000000';
        const fontStyle = localStorage.getItem('luffy_ft_v1') || "'Segoe UI', Tahoma, sans-serif";

        let names = [], amounts = [], currencies = [];
        try {
            names = JSON.parse(localStorage.getItem('luffy_names_v1')) || [];
            amounts = JSON.parse(localStorage.getItem('luffy_amounts_v1')) || [];
            currencies = JSON.parse(localStorage.getItem('luffy_currencies_v1')) || [];
        } catch(e){}

        applyStyles(cName, cNum, cBorder, cBgBox, fontStyle);
        applySpeed(speed);
        render(names, amounts, currencies, 'trackOverlay');
    }

    function init() {
        const slots = document.getElementById('slots');
        
        let savedNames = JSON.parse(localStorage.getItem('luffy_names_v1')) || ["علي الكرخي", "حسين العراقي", "محمد البصراوي"];
        let savedAmounts = JSON.parse(localStorage.getItem('luffy_amounts_v1')) || ["50000", "100", "25000"];
        let savedCurrencies = JSON.parse(localStorage.getItem('luffy_currencies_v1')) || ["IQD", "USD", "IQD"];

        document.getElementById('cName').value = localStorage.getItem('luffy_cn_v1') || '#ffffff';
        document.getElementById('cNum').value = localStorage.getItem('luffy_cm_v1') || '#facc15';
        document.getElementById('cBorder').value = localStorage.getItem('luffy_cb_v1') || '#333333';
        document.getElementById('cBgBox').value = localStorage.getItem('luffy_cbg_v1') || '#000000';
        document.getElementById('fontStyle').value = localStorage.getItem('luffy_ft_v1') || "'Segoe UI', Tahoma, sans-serif";
        document.getElementById('speedRange').value = localStorage.getItem('luffy_sp_v1') || 2;

        slots.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const curr = savedCurrencies[i] || 'IQD';
            slots.innerHTML += `
                <div class="slot-row">
                    <div style="color:#888; text-align:center; line-height:35px;">#${i+1}</div>
                    <input type="text" placeholder="الاسم" class="s-name" value="${savedNames[i] || ''}" oninput="updateAll()">
                    <input type="number" placeholder="المبلغ" class="s-amount" value="${savedAmounts[i] || ''}" oninput="updateAll()">
                    <select class="s-currency" onchange="updateAll()">
                        <option value="IQD" ${curr === 'IQD' ? 'selected' : ''}>د.ع</option>
                        <option value="USD" ${curr === 'USD' ? 'selected' : ''}>$ دولار</option>
                    </select>
                </div>
            `;
        }

        updateAll();
    }

    function applySpeed(val) {
        const seconds = 65 - (val * 5.5);
        document.documentElement.style.setProperty('--speed', `${seconds}s`);

        const txt = document.getElementById('speedValue');
        if (txt) {
            if (val <= 2) txt.innerText = "بطيء جداً";
            else if (val <= 5) txt.innerText = "متوسط";
            else txt.innerText = "سريع";
        }
    }

    function applyStyles(cn, cm, cb, cbg, ft) {
        document.documentElement.style.setProperty('--name-color', cn);
        document.documentElement.style.setProperty('--num-color', cm);
        document.documentElement.style.setProperty('--border-color', cb);
        document.documentElement.style.setProperty('--bg-box-color', cbg);
        document.documentElement.style.setProperty('--font-family', ft);
    }

    function updateAll() {
        const val = document.getElementById('speedRange').value;
        const cn = document.getElementById('cName').value;
        const cm = document.getElementById('cNum').value;
        const cb = document.getElementById('cBorder').value;
        const cbg = document.getElementById('cBgBox').value;
        const ft = document.getElementById('fontStyle').value;

        applySpeed(val);
        applyStyles(cn, cm, cb, cbg, ft);

        const names = Array.from(document.querySelectorAll('.s-name')).map(i => i.value.trim());
        const amounts = Array.from(document.querySelectorAll('.s-amount')).map(i => i.value.trim());
        const currencies = Array.from(document.querySelectorAll('.s-currency')).map(i => i.value);

        render(names, amounts, currencies, 'track');

        // تحديث الرابط في الخانة العلوية
        const baseUrl = window.location.href.split('?')[0].split('#')[0];
        const dataObj = { names, amounts, currencies, sp: val, cn, cm, cb, cbg, ft };
        const encodedData = encodeURIComponent(JSON.stringify(dataObj));
        document.getElementById('finalUrl').value = `${baseUrl}?mode=overlay#${encodedData}`;
    }

    function saveData() {
        const val = document.getElementById('speedRange').value;
        const cn = document.getElementById('cName').value;
        const cm = document.getElementById('cNum').value;
        const cb = document.getElementById('cBorder').value;
        const cbg = document.getElementById('cBgBox').value;
        const ft = document.getElementById('fontStyle').value;
        
        const names = Array.from(document.querySelectorAll('.s-name')).map(i => i.value.trim());
        const amounts = Array.from(document.querySelectorAll('.s-amount')).map(i => i.value.trim());
        const currencies = Array.from(document.querySelectorAll('.s-currency')).map(i => i.value);

        localStorage.setItem('luffy_names_v1', JSON.stringify(names));
        localStorage.setItem('luffy_amounts_v1', JSON.stringify(amounts));
        localStorage.setItem('luffy_currencies_v1', JSON.stringify(currencies));
        localStorage.setItem('luffy_sp_v1', val);
        localStorage.setItem('luffy_cn_v1', cn);
        localStorage.setItem('luffy_cm_v1', cm);
        localStorage.setItem('luffy_cb_v1', cb);
        localStorage.setItem('luffy_cbg_v1', cbg);
        localStorage.setItem('luffy_ft_v1', ft);

        updateAll();
        copyUrl();
        alert('✅ تم حفظ البيانات ونُسخ الرابط الجديد تلقائياً!\n\nضع الرابط المنسوخ في OBS ليظهر التحديث فوراً.');
    }

    function render(names, amounts, currencies, id) {
        let items = [];
        for (let i = 0; i < 10; i++) {
            if (names[i] && names[i] !== '') {
                let amtFormatted = '';
                if (amounts[i] && amounts[i] !== '') {
                    const curr = currencies[i] || 'IQD';
                    const numEng = Number(amounts[i]).toLocaleString('en-US');
                    amtFormatted = curr === 'USD' ? `$${numEng}` : `${numEng} د.ع`;
                }
                items.push(`<div class="marquee-item"><span class="name">${names[i]}</span>${amtFormatted ? `<span class="amount">(${amtFormatted})</span>` : ''}<span class="sep">•</span></div>`);
            }
        }
        const el = document.getElementById(id);
        if (el) {
            const content = items.length ? items.join('') : '<div class="marquee-item"><span class="name">LUFFY - أدخل الأسماء والمبالغ</span> <span class="sep">•</span></div>';
            el.innerHTML = content + content + content + content;
        }
    }

    function copyUrl() {
        const urlInput = document.getElementById('finalUrl');
        urlInput.select();
        navigator.clipboard.writeText(urlInput.value);
    }
</script>
</body>
</html>
